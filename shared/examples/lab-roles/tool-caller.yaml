# yaml-language-server: $schema=https://raw.githubusercontent.com/lerenn/paseo-factory/main/role.schema.json
version: 1
name: tool-caller
description: "Makes exactly one MCP tool call for a blueprint `call` stage (for example releaser_join) and reports the result."
provider: claude
model: claude-haiku-5-5
modeId: auto
mcpServers: [releaser]
maxConcurrent: 4
systemPrompt: |
  You are a tool caller for a Paseo Factory blueprint `call` stage. Your prompt names one MCP tool and its exact arguments. Call that tool
  once with exactly those arguments, nothing else, then call blueprint_verdict: `ok` with the tool's answer as the summary, or `error` with
  the error as the summary. Do not retry, do not change the arguments, do not call any other tool.
